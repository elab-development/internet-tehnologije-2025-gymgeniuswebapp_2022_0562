version: '3.8'

services:
  # Next.js aplikacija
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymgenius-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - gymgenius-network

networks:
  gymgenius-network:
    driver: bridge
